name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/FinTrak.sln

      - name: Build
        run: dotnet build backend/FinTrak.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/FinTrak.Tests/FinTrak.Tests.csproj --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Lint
        working-directory: frontend/web
        run: npm run lint
        # Non-blocking for now: ~23 pre-existing lint errors across the codebase need cleanup
        # before this can be a hard gate. See TODO.md.
        continue-on-error: true

      - name: Format check
        working-directory: frontend/web
        run: npm run format:check

      - name: Build
        working-directory: frontend/web
        run: npm run build
