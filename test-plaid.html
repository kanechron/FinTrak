<!DOCTYPE html>
<html>
<head><title>Plaid Link Test</title></head>
<body>
  <button id="link-btn">Connect Bank</button>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    const handler = Plaid.create({
      token: 'link-sandbox-da0a4d76-9aeb-4ad7-b0af-cac37d624755',
      onSuccess: (public_token, metadata) => {
        console.log('Public token:', public_token);
        alert('Public token: ' + public_token);
      },
      onExit: (err, metadata) => {
        console.log('Exited', err, metadata);
      }
    });

    document.getElementById('link-btn').onclick = () => handler.open();
  </script>
</body>
</html>
